[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "banana-smasher-plugin"
version = "0.1.0"
description = "Stock-vLLM runtime plugin for bs-mixed-tier native-plane packs"
requires-python = ">=3.10"
dependencies = ["numpy==2.3.5", "safetensors==0.8.0"]

[project.entry-points."vllm.general_plugins"]
banana_smasher_plugin = "banana_smasher_plugin:register"

[tool.hatch.build.targets.wheel]
packages = ["src/banana_smasher_plugin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
